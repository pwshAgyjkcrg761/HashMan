name: Mirror from Disroot

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_KEY }}

      - name: Force Mirror from Disroot
        env:
          GH_TOKEN: ${{ secrets.MIRROR_KEY }}
          DISROOT_TOKEN: ${{ secrets.PUBLICREPOACCESSFORGITHUB }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # 1. Clear local tags brought in by checkout
          git tag -l | xargs -r git tag -d

          # 2. Fetch all branches and tags from Disroot
          git remote add disroot https://${DISROOT_TOKEN}@git.disroot.org/pwshAgyjkcrg761/HashMan.git
          git fetch disroot --tags --force

          # 3. Align main branch
          git checkout -B main disroot/main

          # 4. Push main branch and prune remote tags not on Disroot
          git push https://x-access-token:${{ secrets.MIRROR_KEY }}@github.com/pwshAgyjkcrg761/HashMan.git main --force
          git push --prune https://x-access-token:${{ secrets.MIRROR_KEY }}@github.com/pwshAgyjkcrg761/HashMan.git "refs/tags/*:refs/tags/*"

          # # 5. Delete orphaned GitHub releases whose tags no longer exist
          # for tag in $(gh release list --repo pwshAgyjkcrg761/HashMan --limit 1000 --json tagName --jq '.[].tagName'); do
            # if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # echo "Deleting orphaned release for tag: $tag"
              # gh release delete "$tag" --repo pwshAgyjkcrg761/HashMan --yes
            # fi
          # done

          # # 6. Sync Releases and custom assets from Disroot to GitHub
          # DISROOT_API="https://git.disroot.org/api/v1/repos/pwshAgyjkcrg761/HashMan/releases"
          # RELEASES_JSON=$(curl -sSL -H "Authorization: token $DISROOT_TOKEN" "$DISROOT_API" || echo "[]")

          if echo "$RELEASES_JSON" | jq -e 'if type=="array" then . else empty end' >/dev/null 2>&1; then
            echo "$RELEASES_JSON" | jq -c '.[]' | while read -r rel; do
              TAG=$(echo "$rel" | jq -r '.tag_name // empty')
              [ -z "$TAG" ] && continue

              if ! gh release view "$TAG" --repo pwshAgyjkcrg761/HashMan >/dev/null 2>&1; then
                echo "Creating release $TAG on GitHub..."
                TITLE=$(echo "$rel" | jq -r '.name // empty')
                BODY=$(echo "$rel" | jq -r '.body // empty')
                IS_PRERELEASE=$(echo "$rel" | jq -r '.prerelease // false')
                IS_DRAFT=$(echo "$rel" | jq -r '.draft // false')

                TMP_DIR=$(mktemp -d)
                ASSET_ARGS=()

                while read -r asset_url asset_name; do
                  if [ -n "$asset_url" ] && [ -n "$asset_name" ]; then
                    curl -sSL -H "Authorization: token $DISROOT_TOKEN" "$asset_url" -o "$TMP_DIR/$asset_name"
                    ASSET_ARGS+=("$TMP_DIR/$asset_name")
                  fi
                done < <(echo "$rel" | jq -r '.assets[]? | "\(.browser_download_url) \(.name)"')

                FLAGS=()
                [ -n "$TITLE" ] && FLAGS+=(--title "$TITLE")
                [ -n "$BODY" ] && FLAGS+=(--notes "$BODY")
                [ "$IS_PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
                [ "$IS_DRAFT" = "true" ] && FLAGS+=(--draft)

                gh release create "$TAG" "${FLAGS[@]}" "${ASSET_ARGS[@]}" --repo pwshAgyjkcrg761/HashMan
                rm -rf "$TMP_DIR"
              fi
            done
          fi